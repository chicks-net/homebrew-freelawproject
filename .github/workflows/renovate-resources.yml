name: Renovate Resources

on:
  pull_request:
    branches: [main]
    paths:
      - "Formula/x-ray.rb"

permissions: {}

jobs:
  update-resources:
    if: startsWith(github.head_ref, 'renovate/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: false

      # The token makes setup-homebrew configure git auth globally (http
      # extraheader). The tap clone it leaves behind has no credentials of
      # its own, which the "Commit and push" step needs to push with.
      - name: Setup Homebrew
        uses: Homebrew/actions/setup-homebrew@4790763c0a3ba4036f72634dc079c4a7dfcd4878 # 2026.10.19.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # setup-homebrew replaces the checkout with its own clone of GITHUB_SHA
      # on the default branch, so switch back to the PR branch before
      # updating so the commit lands on the PR branch.
      - name: Checkout PR branch
        env:
          PR_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git fetch origin "$PR_BRANCH"
          git checkout -B "$PR_BRANCH" FETCH_HEAD

      - name: Update Python resources
        id: resources
        run: |
          set -euo pipefail

          # `brew update-python-resources` resolves formulas by NAME
          # from the local tap; passing it a file path fails on current
          # Homebrew with `No available formula with the name "x-ray"`,
          # which is how PR #66's resources silently never updated
          # (the failure was masked by a ::warning and a green check).
          # The script stages the PR branch's formula into the tap and
          # updates it by name; any brew failure now fails this job.
          ./scripts/update-x-ray-resources.sh

          if git diff --quiet -- Formula/x-ray.rb; then
            echo "updated=false" >> "$GITHUB_OUTPUT"
          else
            echo "updated=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push
        if: steps.resources.outputs.updated == 'true'
        env:
          PR_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet Formula/x-ray.rb; then
            echo "No changes to commit"
            exit 0
          fi

          git add Formula/x-ray.rb
          git commit -m "chore: update Python resources for Renovate version bump"

          # Pushes made with GITHUB_TOKEN do not trigger new workflow runs,
          # so re-run the Brew Formula workflow manually (or tick Renovate's
          # rebase box) to test the branch with the updated resources.
          git push origin "HEAD:$PR_BRANCH"
