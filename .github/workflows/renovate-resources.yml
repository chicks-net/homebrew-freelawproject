name: Renovate Resources

on:
  pull_request:
    branches: [main]
    paths:
      - "Formula/x-ray.rb"

permissions: {}

jobs:
  update-resources:
    if: startsWith(github.head_ref, 'renovate/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Homebrew
        uses: Homebrew/actions/setup-homebrew@6315ef70a8bfcd2c71104383846591ac113ace33 # main

      - name: Update Python resources
        id: resources
        run: |
          set -euo pipefail

          tap_dir="$(brew --repository)/Library/Taps/chicks-net/homebrew-freelawproject"
          mkdir -p "$tap_dir/Formula"
          cp Formula/x-ray.rb "$tap_dir/Formula/x-ray.rb"

          if brew update-python-resources "$tap_dir/Formula/x-ray.rb"; then
            cp "$tap_dir/Formula/x-ray.rb" Formula/x-ray.rb
            echo "updated=true" >> "$GITHUB_OUTPUT"
          else
            echo "updated=false" >> "$GITHUB_OUTPUT"
            echo "::warning::brew update-python-resources failed"
          fi

      - name: Commit and push
        if: steps.resources.outputs.updated == 'true'
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet Formula/x-ray.rb; then
            echo "No changes to commit"
            exit 0
          fi

          git add Formula/x-ray.rb
          git commit -m "chore: update Python resources for Renovate version bump"
          git push